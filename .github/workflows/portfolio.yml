name: Reproduce statistics portfolio

on:
  push:
  pull_request:

jobs:
  phase:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        phase: [phase1, phase2]
    defaults:
      run:
        working-directory: ${{ matrix.phase }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check statistical calculations
        run: python -m unittest discover -s tests -v
      - name: Reproduce analysis
        run: python -m src.run_all
      - name: Execute notebook
        run: python build_notebook.py
      - name: Generate report values
        run: python build_report.py
      - name: Validate notebook
        run: |
          python - <<'PY'
          import nbformat
          from pathlib import Path
          files = list(Path('notebooks').glob('*.ipynb'))
          assert len(files) == 1
          nb = nbformat.read(files[0], as_version=4)
          nbformat.validate(nb)
          assert all(c.execution_count is not None for c in nb.cells if c.cell_type == 'code')
          PY
